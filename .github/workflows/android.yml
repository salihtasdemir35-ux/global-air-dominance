name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Zip dosyasını aç (varsa)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Zip bulundu: $ZIP"
            mkdir -p _zip && unzip -q -o "$ZIP" -d _zip
            DIR=$(dirname "$(find _zip -name package.json -not -path '*/node_modules/*' | head -1)")
          else
            DIR=.
          fi
          echo "Proje klasörü: $DIR"
          echo "APP_DIR=$DIR" >> $GITHUB_ENV

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri yükle
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Android projesini oluştur
        working-directory: ${{ env.APP_DIR }}
        run: |
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: APK derle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: GlobalAirDominance-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
